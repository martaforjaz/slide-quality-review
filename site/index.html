<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Slide Quality Review</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf3f9;color:#142d50;font:16px/1.5 system-ui}main{max-width:1080px;margin:auto;padding:30px 18px}header,section{padding:20px;border-radius:12px;margin:16px 0}header{background:#142d50;color:white}h1,h2,p{margin-top:0}section{background:#fff;border:1px solid #c6d6e6}button,input,select{font:inherit}button{cursor:pointer;padding:5px 10px}label{display:inline-block;margin-bottom:10px}.layout{display:grid;grid-template-columns:250px 1fr;gap:20px}canvas{max-width:100%;height:auto}#queue button{display:block;text-align:left;width:100%;margin:6px 0}#queue button[aria-pressed=true]{border:2px solid #286e64}a{color:#285886}@media(max-width:650px){.layout{grid-template-columns:1fr}}
</style></head><body><main><a href="../#slide-quality">Marta Forjaz · Portfolio</a><header><h1>Slide Quality Review</h1><p>Triage suspicious regions in a batch of microscopy images.</p></header>
<section><button id="example">Load example batch</button> <label>Or add PNG / JPEG files <input id="files" type="file" multiple accept="image/png,image/jpeg"></label><p id="status" role="status">Images are processed on this device.</p><label>Flag tiles below this fraction of local reference <input id="threshold" type="range" min=".05" max=".65" step=".01" value=".20"> <output id="value">0.20</output></label></section>
<section class="layout"><div><h2>Review queue</h2><div id="queue"></div><button id="export">Export review CSV</button></div><div><h2 id="title">Select an image</h2><canvas id="canvas" hidden></canvas><p id="summary"></p><label>Review decision <select id="decision" disabled><option value="pending">Pending</option><option value="rescan">Request rescan</option><option value="accept">Accept</option><option value="manual">Manual review</option></select></label> <button id="toggle">Toggle overlay</button></div></section>
<p>Examples use an open IHC micrograph. One copy contains injected defocus. <a href="https://github.com/martaforjaz/slide-quality-review">Methods and limitations</a>.</p></main><script type="module" src="app.mjs"></script></body></html>
